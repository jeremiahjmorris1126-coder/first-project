<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#162032" />
    </linearGradient>
    <linearGradient id="truckGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#10b981" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="4" />

  <!-- Radar / Fleet grid circles in background -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#1e293b" stroke-width="2" stroke-dasharray="6,6" opacity="0.6" />
  <circle cx="256" cy="256" r="130" fill="none" stroke="#1e293b" stroke-width="2" stroke-dasharray="4,4" opacity="0.4" />

  <!-- Truck Icon Body -->
  <g filter="url(#glow)">
    <!-- Trailer -->
    <rect x="90" y="160" width="220" height="150" rx="16" fill="url(#truckGrad)" />
    <!-- Cab -->
    <path d="M310 200 L370 200 C382 200 392 208 396 220 L418 268 C421 274 422 281 422 288 L422 310 C422 318 416 324 408 324 L310 324 Z" fill="url(#truckGrad)" />
    <!-- Cab Window -->
    <path d="M325 215 L368 215 C374 215 379 219 381 225 L394 255 C396 260 392 265 386 265 L325 265 Z" fill="#0a0e17" opacity="0.85" />
    <!-- Headlight -->
    <circle cx="414" cy="295" r="7" fill="#fbbf24" />
  </g>

  <!-- Wheels -->
  <!-- Rear Wheels -->
  <circle cx="140" cy="325" r="32" fill="#0a0e17" stroke="#10b981" stroke-width="6" />
  <circle cx="140" cy="325" r="14" fill="#3b82f6" />
  
  <circle cx="210" cy="325" r="32" fill="#0a0e17" stroke="#10b981" stroke-width="6" />
  <circle cx="210" cy="325" r="14" fill="#3b82f6" />

  <!-- Front Wheel -->
  <circle cx="365" cy="325" r="32" fill="#0a0e17" stroke="#10b981" stroke-width="6" />
  <circle cx="365" cy="325" r="14" fill="#3b82f6" />

  <!-- Speed / Telematics waves -->
  <path d="M120 195 L270 195" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.3" />
  <path d="M120 225 L240 225" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.4" />
  <path d="M120 255 L210 255" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.3" />

  <!-- Badge Text -->
  <text x="256" y="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="4">TRUCKWITHEASE</text>
  <text x="256" y="450" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#10b981" text-anchor="middle" letter-spacing="3">FLEET OS</text>
</svg>
